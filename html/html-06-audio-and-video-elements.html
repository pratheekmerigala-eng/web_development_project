<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audio and Video Elements</title>
    <link rel="stylesheet" href="../assets/style.css">

<body>
    <div class="wrap">

```
    <h1>Audio and Video Elements</h1>

    <p class="d">
        Working demonstration of audio and video elements.
    </p>

    <h2>Audio Element</h2>

    <audio controls>
        <source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg">
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h2>Video Element</h2>

    <video controls width="100%">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>

    <h2>Audio Element with Loop</h2>

    <audio controls loop>
        <source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg">
    </audio>

    <h2>Video Element with Poster</h2>

    <video controls width="100%" poster="../assets/video-poster.jpg">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>

    <nav>
        <a class="btn" href="../index.html">
            Home
        </a>

        <a class="btn" href="index.html">
            HTML Programs
        </a>
    </nav>

</div>
